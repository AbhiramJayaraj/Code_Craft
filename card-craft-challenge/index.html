<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Edavappathi — Bottled First Rain</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="experience">

    <!-- Ambient background -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <!-- Full-page rain -->
    <div class="rain-field"></div>

    <!-- Product stage -->
    <section class="product-stage">

      <div class="stage-glow"></div>

      <!-- =====================================================
           PRODUCT CARD
      ====================================================== -->

      <article class="product-card">

        <!-- Card texture -->
        <div class="card-noise"></div>
        <div class="card-rain"></div>

        <!-- ===================================================
             TOP PAPER LABEL
        ==================================================== -->

        <div class="paper-label">
          <span class="malayalam">കാലവർഷം</span>

          <span class="label-line"></span>

          <span>COLLECTION №01</span>
        </div>


        <!-- ===================================================
             GOLD SEAL
        ==================================================== -->

        <div class="collector-seal">

          <span>CASK</span>

          <strong>₹149</strong>

          <small>LTD · 500</small>

        </div>


        <!-- ===================================================
             VERTICAL ARCHIVE MARK
        ==================================================== -->

        <div class="vertical-mark">

          <span>FIRST RAIN</span>

          <i></i>

          <span>KERALA</span>

        </div>


        <!-- ===================================================
             BOTTLE
        ==================================================== -->

        <div class="bottle-area">

          <div class="bottle-shadow"></div>

          <div class="bottle">

            <!-- Cap -->
            <div class="bottle-cap">

              <div class="cap-highlight"></div>

            </div>


            <!-- Neck -->
            <div class="bottle-neck">

              <div class="neck-reflection"></div>

            </div>


            <!-- Glass body -->
            <div class="glass-body">

              <!-- Rainwater -->
              <div class="liquid">

                <div class="liquid-wave wave-one"></div>
                <div class="liquid-wave wave-two"></div>

                <span class="particle particle-one"></span>
                <span class="particle particle-two"></span>
                <span class="particle particle-three"></span>
                <span class="particle particle-four"></span>

              </div>


              <!-- Glass depth -->
              <div class="glass-depth"></div>


              <!-- Reflections -->
              <div class="glass-reflection reflection-one"></div>
              <div class="glass-reflection reflection-two"></div>


              <!-- Moving shine -->
              <div class="bottle-shine"></div>

            </div>

          </div>

        </div>


        <!-- ===================================================
             PRODUCT INFORMATION
        ==================================================== -->

        <div class="product-info">

          <div class="eyebrow">

            <span></span>

            <p>MONSOON ARCHIVE</p>

            <span></span>

          </div>


          <h1>Edavappathi</h1>


          <p class="tagline">
            BOTTLED FIRST RAIN
          </p>


          <!-- Specifications -->

          <div class="specifications">

            <div class="spec">

              <span>VOL</span>
              <strong>90ML</strong>

            </div>


            <div class="separator"></div>


            <div class="spec">

              <span>BATCH</span>
              <strong>NO. 01</strong>

            </div>


            <div class="separator"></div>


            <div class="spec">

              <span>MONSOON</span>
              <strong>2026</strong>

            </div>

          </div>

        </div>


        <!-- ===================================================
             CTA
        ==================================================== -->

        <div class="reserve-button">

          <span class="button-icon">◆</span>

          <span>RESERVE A BOTTLE</span>

          <span class="arrow">↗</span>

        </div>


        <!-- ===================================================
             BOTTOM STORY
        ==================================================== -->

        <div class="story">

          Distilled from Kerala's opening downpour.<br>
          Handle gently — it still remembers thunder.

        </div>


        <!-- ===================================================
             BOTTOM RIGHT SERIAL
        ==================================================== -->

        <div class="serial">

          10°17' N<br>
          76°16' E

        </div>

      </article>

    </section>

  </main>

</body>
</html>
